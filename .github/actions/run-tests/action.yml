name: "Run tests"
runs:
  using: "composite"
  steps:
    # Chmod before the database starts: data/db18 (the postgres volume) does not
    # exist yet, so the recursive chmod cannot hit it. Postgres exits on a
    # world-writable data directory, and chmodding it after `up` raced initdb's
    # permission fix, making whole CI runs fail with "connection refused".
    # The whole data/ tree must stay writable — tests write to data/files and
    # data/test/* (see tests.yaml and the Config defaults).
    - name: Create a directory for asset files
      shell: bash
      run: |
        sudo mkdir -p data/test
        sudo chmod -R 777 data
    - name: Start database for tests
      shell: bash
      run: docker compose --file docker-compose-dev.yml up db -d --wait
    - name: Run tests
      shell: bash
      run: gradle test -i
    - name: Dump database logs on failure
      if: failure()
      shell: bash
      run: docker compose --file docker-compose-dev.yml logs --no-color db
